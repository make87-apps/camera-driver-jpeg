version: 1
interfaces:
  - name: zenoh-client
    protocol: zenoh
    default_port:
      name: zenoh-client
      protocol: TCP
      target_port: 7447
    providers:
      - name: GET_CAMERA_IMAGE
        request_spec:
          make87_message: make87_messages.core.Empty
        response_spec:
          make87_message: make87_messages.image.compressed.image_jpeg.ImageJPEG
        encoding: proto
    publishers:
      - name: IMAGE
        spec:
          make87_message: make87_messages.image.compressed.image_jpeg.ImageJPEG
        encoding: proto
peripheral_requirements:
  - name: CAMERA
    peripheral_type: Camera
build:
  build_kit:
    name: python3
dev_build:
  build_kit:
    name: python3